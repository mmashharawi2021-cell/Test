name: CI
on:
  push:
  pull_request:

jobs:
  python-and-postgis:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:18-3.6
        env:
          POSTGRES_DB: geosmart
          POSTGRES_USER: geosmart
          POSTGRES_PASSWORD: geosmart
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U geosmart -d geosmart"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://geosmart:geosmart@localhost:5432/geosmart
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r api/requirements.txt pytest geopandas==1.1.4 shapely==2.1.2 pyproj==3.7.2
      - name: Python checks
        run: |
          python -m compileall -q api python tests
          pytest -q
          python python/validate_features.py
          python python/etl.py
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Database migration and smoke tests
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f database/migrations/001_init.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f database/seed/001_seed.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f database/tests/001_smoke.sql

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npm run build
